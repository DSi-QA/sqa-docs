name: Build and Deploy SQA Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.docx"
      - "docs/index.md"
      - "mkdocs.yml"
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install LibreOffice
        run: sudo apt-get update -qq && sudo apt-get install -y libreoffice

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Convert .docx files and generate pages
        run: python scripts/generate_pages.py

      - name: Commit generated files back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: regenerate pdf and md pages [skip ci]"
            git push origin main
          fi

      - name: Build MkDocs site
        run: mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
